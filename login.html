<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – BioPay</title>
  <meta name="description" content="Login to your BioPay account as a customer or vendor." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="bg-animated">
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <nav class="navbar scrolled">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <div class="logo-icon">
          <svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="19" stroke="url(#lg3)" stroke-width="2"/><path d="M20 8C13.4 8 8 13.4 8 20s5.4 12 12 12 12-5.4 12-12" stroke="url(#lg3)" stroke-width="2" stroke-linecap="round"/><path d="M20 12c-4.4 0-8 3.6-8 8s3.6 8 8 8 8-3.6 8-8" stroke="url(#lg3)" stroke-width="2" stroke-linecap="round"/><path d="M20 16c-2.2 0-4 1.8-4 4s1.8 4 4 4 4-1.8 4-4" stroke="url(#lg3)" stroke-width="2" stroke-linecap="round"/><circle cx="20" cy="20" r="2" fill="url(#lg3)"/><defs><linearGradient id="lg3" x1="8" y1="8" x2="32" y2="32" gradientUnits="userSpaceOnUse"><stop stop-color="#7C3AED"/><stop offset="1" stop-color="#2563EB"/></linearGradient></defs></svg>
        </div>
        <span class="logo-text">Bio<span class="logo-accent">Pay</span></span>
      </a>
      <div style="margin-left:auto;">
        <a href="index.html" class="btn btn-ghost">← Home</a>
      </div>
    </div>
  </nav>

  <div class="form-page">
    <div class="form-card">
      <div class="form-header">
        <div class="form-icon">
          <svg viewBox="0 0 48 48" fill="none"><rect x="8" y="20" width="32" height="22" rx="4" stroke="url(#lGrad)" stroke-width="2.5"/><path d="M16 20v-4a8 8 0 0 1 16 0v4" stroke="url(#lGrad)" stroke-width="2.5" stroke-linecap="round"/><circle cx="24" cy="31" r="3" fill="url(#lGrad)"/><path d="M24 34v3" stroke="url(#lGrad)" stroke-width="2.5" stroke-linecap="round"/><defs><linearGradient id="lGrad" x1="8" y1="8" x2="40" y2="44" gradientUnits="userSpaceOnUse"><stop stop-color="#7C3AED"/><stop offset="1" stop-color="#2563EB"/></linearGradient></defs></svg>
        </div>
        <h1>Welcome Back</h1>
        <p>Login to your BioPay account</p>
      </div>

      <!-- Account Type Toggle -->
      <div class="login-toggle">
        <button class="toggle-btn active" id="toggleCustomer" onclick="switchType('customer')">Customer</button>
        <button class="toggle-btn" id="toggleVendor" onclick="switchType('vendor')">Vendor</button>
      </div>

      <div id="loginError" class="alert alert-error" style="display:none;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="loginErrorText">Invalid credentials. Please try again.</span>
      </div>

      <div class="form-group">
        <label for="loginEmail">Email Address</label>
        <div class="input-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          <input type="email" id="loginEmail" placeholder="your@email.com" autocomplete="email" />
        </div>
        <span class="field-error" id="loginEmailError">Please enter a valid email</span>
      </div>

      <div class="form-group">
        <label for="loginPassword">
          Password
          <a href="#" style="float:right; font-size:12px; color:var(--primary-light); text-decoration:none; font-weight:600;">Forgot Password?</a>
        </label>
        <div class="password-wrap">
          <input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password" />
          <button type="button" class="password-toggle" onclick="togglePassword('loginPassword', this)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <span class="field-error" id="loginPasswordError">Please enter your password</span>
      </div>

      <div class="form-group">
        <label class="checkbox-group">
          <input type="checkbox" id="rememberMe" />
          <span>Remember me on this device</span>
        </label>
      </div>

      <button class="btn btn-primary w-full btn-large" id="loginBtn" onclick="doLogin()" style="margin-top:8px;">
        Login to BioPay
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
      </button>

      <div class="form-divider"><span>or continue with</span></div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
        <button class="btn btn-ghost" style="border:1px solid var(--border); justify-content:center; font-size:13px;" onclick="googleLogin()">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Google
        </button>
        <button class="btn btn-ghost" style="border:1px solid var(--border); justify-content:center; font-size:13px;" onclick="aadharLogin()">
          🇮🇳 Aadhaar OTP
        </button>
      </div>

      <div class="form-footer" style="margin-top:24px;">
        Don't have an account?<br/>
        <a href="register-customer.html">Customer Registration</a> · <a href="register-vendor.html">Vendor Registration</a>
      </div>
    </div>
  </div>

  <style>
    .login-toggle {
      display: flex;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 28px;
      gap: 4px;
    }
    .toggle-btn {
      flex: 1;
      padding: 10px;
      border-radius: 9px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s;
    }
    .toggle-btn.active {
      background: var(--grad-primary);
      color: #fff;
      box-shadow: 0 4px 16px rgba(124,58,237,0.3);
    }
  </style>

  <script src="js/login.js"></script>
</body>
</html>
